<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics & Support Section Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #1c1411;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #2a1b15;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ea580c;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fb923c;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .clock {
            font-size: 1rem;
            font-weight: 500;
            color: #cbd5e1;
            white-space: nowrap;
        }
        .logo-img {
            height: 40px;
            width: auto;
            background: white;
            padding: 3px;
            border-radius: 4px;
            object-fit: contain;
        }
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .card.guesthouse-card {
            grid-row: span 2;
        }
        .card {
            background-color: #261914;
            border: 1px solid #432418;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background-color: #332018;
            padding: 8px 12px;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #432418;
            color: #fed7aa;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .card-body::-webkit-scrollbar {
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }
        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid #3b2319;
        }
        th {
            color: #fdba74;
            font-weight: 600;
            background-color: rgba(51, 32, 24, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            color: #f1f5f9;
        }
        tr:hover td {
            background-color: rgba(234, 88, 12, 0.15);
        }
        .empty-msg {
            color: #9a7b6c;
            text-align: center;
            padding: 10px;
            font-style: italic;
            font-size: 0.9rem;
        }
        
        /* Airport Row Roll-Over Effect */
        .row-roll-up td {
            animation: airportRoll 0.6s ease-in forwards;
        }
        @keyframes airportRoll {
            0% { 
                opacity: 1; 
                padding: 6px 8px; 
                font-size: 0.95rem; 
            }
            100% { 
                opacity: 0; 
                padding: 0 8px; 
                font-size: 0px; 
                line-height: 0; 
                border-bottom: none; 
                color: transparent; 
            }
        }

        /* Bottom Photo Ticker Bar */
        .photo-ticker {
            background-color: #2a1b15;
            border-top: 2px solid #ea580c;
            height: 140px;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .ticker-track {
            display: flex;
            gap: 15px;
            padding: 0 15px;
            animation: scrollTicker 90s linear infinite;
            will-change: transform;
        }
        .ticker-item {
            height: 110px;
            width: 170px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #432418;
            background-color: #1c1411;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ticker-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Logistics & Support Section, O/o the PAG (Audit), Telangana</h1>
        <div class="header-right">
            <div class="clock" id="live-clock">Loading...</div>
            <img src="logo.png" alt="CAG Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
    </header>

    <div class="main-grid">
        <div class="card guesthouse-card">
            <div class="card-header">Guest House Bookings (10 Rooms)</div>

                <div class="empty-msg">Loading data from Google Sheet...</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Exams Scheduled</div>
            <div class="card-body" id="exams-container">
                <div class="empty-msg">No active entries currently.</div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; overflow: hidden; height: 100%;">
            <div class="card" style="flex: 1;">
                <div class="card-header">Meetings & Reviews</div>
                <div class="card-body" id="meetings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>
            <div class="card" style="flex: 1;">
                <div class="card-header">Training Programs</div>
                <div class="card-body" id="trainings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>
        </div>
    </div>

    <div class="photo-ticker">
        <div class="ticker-track" id="ticker-track"></div>
    </div>
