<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics & Support Section Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #1c1411;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #2a1b15;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ea580c;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fb923c;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .clock {
            font-size: 1rem;
            font-weight: 500;
            color: #cbd5e1;
            white-space: nowrap;
        }
        .logo-img {
            height: 38px;
            width: auto;
            background: white;
            padding: 3px;
            border-radius: 4px;
            object-fit: contain;
        }
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .card.guesthouse-card {
            grid-row: span 2;
        }
        .card {
            background-color: #261914;
            border: 1px solid #432418;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background-color: #332018;
            padding: 8px 12px;
            font-size: 0.9rem;
            font-weight: 600;
            border-bottom: 1px solid #432418;
            color: #fed7aa;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.8rem;
        }
        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid #3b2319;
        }
        th {
            color: #fdba74;
            font-weight: 600;
            background-color: rgba(51, 32, 24, 0.9);
            position: sticky;
            top: 0;
        }
        td {
            color: #f1f5f9;
        }
        tr:hover td {
            background-color: rgba(234, 88, 12, 0.15);
        }
        .empty-msg {
            color: #9a7b6c;
            text-align: center;
            padding: 10px;
            font-style: italic;
            font-size: 0.8rem;
        }
        /* Bottom Photo Ticker Bar */
        .photo-ticker {
            background-color: #2a1b15;
            border-top: 2px solid #ea580c;
            height: 110px;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .ticker-track {
            display: flex;
            gap: 15px;
            padding: 0 15px;
            animation: scrollTicker 180s linear infinite;
            will-change: transform;
        }
        .ticker-track:hover {
            animation-play-state: paused;
        }
        .ticker-item {
            height: 90px;
            width: 140px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #432418;
            background-color: #1c1411;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ticker-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Logistics & Support Section, O/o the PAG (Audit), Telangana</h1>
        <div class="header-right">
            <div class="clock" id="live-clock">Loading...</div>
            <img src="logo.png" alt="CAG Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
    </header>

    <div class="main-grid">
        <!-- Guest House Card -->
        <div class="card guesthouse-card">
            <div class="card-header">Guest House Bookings (10 Rooms)</div>
            <div class="card-body" id="guesthouse-container">
                <div class="empty-msg">Loading data from Google Sheet...</div>
            </div>
        </div>

        <!-- Exams Card -->
        <div class="card">
            <div class="card-header">Exams Scheduled</div>
            <div class="card-body" id="exams-container">
                <div class="empty-msg">No active entries currently.</div>
            </div>
        </div>

        <!-- Meetings & Trainings Grid Stack -->
        <div style="display: flex; flex-direction: column; gap: 10px; overflow: hidden; height: 100%;">
            <div class="card" style="flex: 1;">
                <div class="card-header">Meetings & Reviews</div>
                <div class="card-body" id="meetings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>
            <div class="card" style="flex: 1;">
                <div class="card-header">Training Programs</div>
                <div class="card-body" id="trainings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Randomized Photo Marquee Bar -->
    <div class="photo-ticker">
        <div class="ticker-track" id="ticker-track"></div>
    </div>

    <script>
        // Live Clock
        function updateClock() {
            try {
                const now = new Date();
                document.getElementById('live-clock').innerText = now.toLocaleDateString('en-IN', {
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
                }) + ' | ' + now.toLocaleTimeString();
            } catch (e) {}
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Google Sheet CSV Endpoint
        const csvUrl = "https://docs.google.com/spreadsheets/d/1AOUTCpbfal9HYFDtClwAAQqWEA1R-vE0SenWH-8/gviz/tq?tqx=out:csv&gid=91440551";

        async function fetchDashboardData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.text();
                parseCSVAndRender(data);
            } catch (error) {
                console.warn("Live fetch failed, attempting fallback render...", error);
                renderFallbackData();
            }
        }

        function renderFallbackData() {
            const guesthouseRows = [
                ["Lekha Duplex 1", "Shri Rakesh Sajjan", "DAG", "1/11/2026", "12/11/2026"],
                ["Lekha Duplex 2", "Shri ABCS XYZ", "DAG", "1/12/2026", "2/12/2026"],
                ["Lekha Duplex 3", "-", "-", "-", "-"],
                ["Lekha Duplex 4", "-", "-", "-", "-"],
                ["Lekha 5th Floor_1 (1+1)", "-", "-", "-", "-"],
                ["Lekha 5th Floor_2", "-", "-", "-", "-"],
                ["Lekha 5th Floor_3", "-", "-", "-", "-"],
                ["Lekha 5th Floor_4", "-", "-", "-", "-"],
                ["Main Office Suit 1", "-", "-", "-", "-"],
                ["Main Office Suit 2", "-", "-", "-", "-"]
            ];
            const examRows = [
                ["SAS EXAM", "CAG HQrs", "-", "5/12/2026", "5/12/2026", "10:00 AM", "5:30 PM"]
            ];
            const meetingRows = [
                ["Meeting with HoDs & GOs on Audit Diwas 2026", "Logistics & Support", "-", "26/10/2026", "3:00 PM", "5:30 PM"]
            ];
            const trainingRows = [
                ["Training for SAS Exam", "Training Wing", "-", "1/11/2026", "15/11/2026", "10:00 AM", "5:30 PM"]
            ];

            renderTable('guesthouse-container', ['Room', 'Guest', 'Designation', 'From', 'To'], guesthouseRows);
            renderTable('exams-container', ['Exam / Subject', 'Section', 'Venue', 'Date From', 'Date To', 'Start Time', 'End Time'], examRows);
            renderTable('meetings-container', ['Meeting Name', 'Section', 'Venue', 'Date', 'Start Time', 'End Time'], meetingRows);
            renderTable('trainings-container', ['Program Name', 'Section', 'Venue', 'Start Date', 'End Date', 'Start Time', 'End Time'], trainingRows);
        }

        function cleanVal(val) {
            if (!val || val === '' || val === '-' || val.includes('1899') || val.includes('NaN')) return '-';
            if (val.includes('00:00:00')) {
                return val.split(' ')[0];
            }
            return val;
        }

        function parseCSVAndRender(csvText) {
            const lines = csvText.split('\n').map(line => {
                return line.split(',').map(val => val.replace(/^"|"$/g, '').trim());
            });

            let guesthouseRows = [];
            let examRows = [];
            let meetingRows = [];
            let trainingRows = [];
            let currentSection = 'guesthouse';

            lines.forEach(cols => {
                if (!cols || cols.length === 0 || cols.every(c => c === '')) return;
                
                const textJoined = cols.join(' ').toUpperCase();
                
                if (textJoined.includes('EXAMS SCHEDULED')) { currentSection = 'exams'; return; }
                if (textJoined.includes('MEETINGS & REVIEWS')) { currentSection = 'meetings'; return; }
                if (textJoined.includes('TRAINING PROGRAMS')) { currentSection = 'trainings'; return; }
                if (textJoined.includes('GUEST HOUSE BOOKINGS')) { currentSection = 'guesthouse'; return; }

                if (textJoined.includes('---') || textJoined.includes('ROOM NUMBER') || textJoined.includes('EXAM / SUBJECT') || textJoined.includes('MEETING NAME') || textJoined.includes('TRAINING PROGRAM')) {
                    return;
                }

                // Guest House: Room (0), Guest (1), Designation (2), From (3), To (4)
                if (currentSection === 'guesthouse' && cols[0]) {
                    guesthouseRows.push([cols[0], cols[1], cols[2], cleanVal(cols[3]), cleanVal(cols[4])]);
                }
                // Exams: Subject (0), Section (1), Venue (2), Date From (3), Date To (4), Start Time (5), End Time (6)
                if (currentSection === 'exams' && cols[0]) {
                    examRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[4]), cleanVal(cols[5]), cleanVal(cols[6])]);
                }
                // Meetings: Name (0), Section (1), Venue (2), Date (3), Start Time (5), End Time (6) -> Note Col 4 is blank space in sheet
                if (currentSection === 'meetings' && cols[0]) {
                    meetingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[5]), cleanVal(cols[6])]);
                }
                // Trainings: Program (0), Section (1), Venue (2), Start Date (3), End Date (4), Start Time (6), End Time (7)
                if (currentSection === 'trainings' && cols[0]) {
                    trainingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[4]), cleanVal(cols[6]), cleanVal(cols[7])]);
                }
            });

            if (guesthouseRows.length === 0 && examRows.length === 0) {
                renderFallbackData();
                return;
            }

            renderTable('guesthouse-container', ['Room', 'Guest', 'Designation', 'From', 'To'], guesthouseRows);
            renderTable('exams-container', ['Exam / Subject', 'Section', 'Venue', 'Date From', 'Date To', 'Start Time', 'End Time'], examRows);
            renderTable('meetings-container', ['Meeting Name', 'Section', 'Venue', 'Date', 'Start Time', 'End Time'], meetingRows);
            renderTable('trainings-container', ['Program Name', 'Section', 'Venue', 'Start Date', 'End Date', 'Start Time', 'End Time'], trainingRows);
        }

        function renderTable(containerId, headers, rows) {
            const container = document.getElementById(containerId);
            const validRows = rows.filter(row => row.some(cell => cell && cell !== '-' && cell !== ''));

            if (!validRows || validRows.length === 0) {
                container.innerHTML = `<div class="empty-msg">No active entries currently.</div>`;
                return;
            }

            let html = `<table><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;

            validRows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => {
                    html += `<td>${cell || '-'}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        // --- Dynamic Google Drive Photo Ticker ---
        async function initPhotoTicker() {
            const track = document.getElementById('ticker-track');
            if (!track) return;

            try {
                // TODO: Replace with your deployed Apps Script Web App URL
                const webAppUrl = "https://script.google.com/macros/s/AKfycbzXUs9luJNmNT5pFW00NAqeRGCdoH4x0HtbRK6H07ZaAbMfAbbE1tXlKfujGigi158TNA/exec";
                
                const response = await fetch(webAppUrl);
                let photoUrls = await response.json();

                if (!photoUrls || photoUrls.length === 0) {
                    photoUrls = [
                        "https://picsum.photos/id/10/200/150",
                        "https://picsum.photos/id/20/200/150"
                    ];
                }

                // Shuffle array randomly
                let shuffled = [...photoUrls].sort(() => Math.random() - 0.5);
                let doubleList = [...shuffled, ...shuffled];

                track.innerHTML = doubleList.map(url => `
                    <div class="ticker-item">
                        <img src="${url}" alt="Office Photo" loading="lazy" onerror="this.src='logo.png'">
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error loading drive photos, using placeholders:", error);
                const placeholders = [
                    "https://picsum.photos/id/10/200/150",
                    "https://picsum.photos/id/20/200/150",
                    "https://picsum.photos/id/30/200/150"
                ];
                track.innerHTML = [...placeholders, ...placeholders].map(url => `
                    <div class="ticker-item"><img src="${url}" alt="Placeholder"></div>
                `).join('');
            }
        }

        fetchDashboardData();
        initPhotoTicker();
        
        // Auto-refresh data and ticker every 1 minute (60000 ms)
        setInterval(fetchDashboardData, 60000);
    </script>
</body>
</html>
