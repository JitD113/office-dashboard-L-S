<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics & Support Section Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #1c1411;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #2a1b15;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ea580c;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fb923c;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .clock {
            font-size: 1rem;
            font-weight: 500;
            color: #cbd5e1;
            white-space: nowrap;
        }
        .logo-img {
            height: 38px;
            width: auto;
            background: white;
            padding: 3px;
            border-radius: 4px;
            object-fit: contain;
        }
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            padding: 10px;
            overflow: hidden;
        }
        .card.guesthouse-card {
            grid-row: span 2;
        }
        .card {
            background-color: #261914;
            border: 1px solid #432418;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background-color: #332018;
            padding: 8px 12px;
            /* ENLARGED HEADER FONT */
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #432418;
            color: #fed7aa;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            padding: 6px 10px;
            /* Hides scrollbar for clean TV display */
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .card-body::-webkit-scrollbar {
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            /* ENLARGED TABLE FONT */
            font-size: 0.95rem;
        }
        th, td {
            padding: 6px 8px;
            border-bottom: 1px solid #3b2319;
        }
        th {
            color: #fdba74;
            font-weight: 600;
            background-color: rgba(51, 32, 24, 0.95);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            color: #f1f5f9;
        }
        tr:hover td {
            background-color: rgba(234, 88, 12, 0.15);
        }
        .empty-msg {
            color: #9a7b6c;
            text-align: center;
            padding: 10px;
            font-style: italic;
            font-size: 0.9rem;
        }
        /* Bottom Photo Ticker Bar */
        .photo-ticker {
            background-color: #2a1b15;
            border-top: 2px solid #ea580c;
            /* ENLARGED TICKER BAR HEIGHT */
            height: 140px;
            display: flex;
            align-items: center;
            overflow: hidden;
            position: relative;
            flex-shrink: 0;
        }
        .ticker-track {
            display: flex;
            gap: 15px;
            padding: 0 15px;
            /* SLOWED DOWN ANIMATION (90s) */
            animation: scrollTicker 450s linear infinite;
            will-change: transform;
        }
        .ticker-item {
            /* ENLARGED PHOTO DIMENSIONS */
            height: 200px;
            width: 300px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #432418;
            background-color: #1c1411;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ticker-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        @keyframes scrollTicker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Logistics & Support Section, O/o the PAG (Audit), Telangana</h1>
        <div class="header-right">
            <div class="clock" id="live-clock">Loading...</div>
            <img src="logo.png" alt="CAG Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
    </header>

    <div class="main-grid">
        <div class="card guesthouse-card">
            <div class="card-header">Guest House Bookings (10 Rooms)</div>
            <div class="card-body" id="guesthouse-container">
                <div class="empty-msg">Loading data from Google Sheet...</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Exams Scheduled</div>
            <div class="card-body" id="exams-container">
                <div class="empty-msg">No active entries currently.</div>
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 10px; overflow: hidden; height: 100%;">
            <div class="card" style="flex: 1;">
                <div class="card-header">Meetings & Reviews</div>
                <div class="card-body" id="meetings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>
            <div class="card" style="flex: 1;">
                <div class="card-header">Training Programs</div>
                <div class="card-body" id="trainings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>
        </div>
    </div>

    <div class="photo-ticker">
        <div class="ticker-track" id="ticker-track"></div>
    </div>

    <script>
        // Live Clock
        function updateClock() {
            try {
                const now = new Date();
                document.getElementById('live-clock').innerText = now.toLocaleDateString('en-IN', {
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
                }) + ' | ' + now.toLocaleTimeString();
            } catch (e) {}
        }
        setInterval(updateClock, 1000);
        updateClock();

        const csvUrl = "https://docs.google.com/spreadsheets/d/1AOUTCpbfal9HYFDtClwAAQqWEA1R-vE0SenWH-8/gviz/tq?tqx=out:csv&gid=91440551";

        let scrollIntervals = []; // Array to manage airport ticker animations

        async function fetchDashboardData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.text();
                parseCSVAndRender(data);
            } catch (error) {
                console.warn("Live fetch failed.", error);
            }
        }

        function cleanVal(val) {
            if (!val || val === '' || val === '-' || val.includes('1899') || val.includes('NaN')) return '-';
            if (val.includes('00:00:00')) return val.split(' ')[0];
            return val;
        }

        function parseCSVAndRender(csvText) {
            // Clear old animations before re-rendering
            scrollIntervals.forEach(clearInterval);
            scrollIntervals = [];

            const lines = csvText.split('\n').map(line => {
                return line.split(',').map(val => val.replace(/^"|"$/g, '').trim());
            });

            let guesthouseRows = [];
            let examRows = [];
            let meetingRows = [];
            let trainingRows = [];
            let currentSection = 'guesthouse';

            lines.forEach(cols => {
                if (!cols || cols.length === 0 || cols.every(c => c === '')) return;
                
                const textJoined = cols.join(' ').toUpperCase();
                
                if (textJoined.includes('EXAMS SCHEDULED')) { currentSection = 'exams'; return; }
                if (textJoined.includes('MEETINGS & REVIEWS')) { currentSection = 'meetings'; return; }
                if (textJoined.includes('TRAINING PROGRAMS')) { currentSection = 'trainings'; return; }
                if (textJoined.includes('GUEST HOUSE BOOKINGS')) { currentSection = 'guesthouse'; return; }

                if (textJoined.includes('---') || textJoined.includes('ROOM NUMBER') || textJoined.includes('EXAM / SUBJECT') || textJoined.includes('MEETING NAME') || textJoined.includes('TRAINING PROGRAM')) {
                    return;
                }

                if (currentSection === 'guesthouse' && cols[0]) {
                    guesthouseRows.push([cols[0], cols[1], cols[2], cleanVal(cols[3]), cleanVal(cols[4])]);
                }
                if (currentSection === 'exams' && cols[0]) {
                    examRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[4]), cleanVal(cols[5]), cleanVal(cols[6])]);
                }
                if (currentSection === 'meetings' && cols[0]) {
                    meetingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[5]), cleanVal(cols[6])]);
                }
                if (currentSection === 'trainings' && cols[0]) {
                    trainingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[4]), cleanVal(cols[6]), cleanVal(cols[7])]);
                }
            });

            renderTable('guesthouse-container', ['Room', 'Guest', 'Designation', 'From', 'To'], guesthouseRows);
            renderTable('exams-container', ['Exam / Subject', 'Section', 'Venue', 'Date From', 'Date To', 'Start Time', 'End Time'], examRows);
            renderTable('meetings-container', ['Meeting Name', 'Section', 'Venue', 'Date', 'Start Time', 'End Time'], meetingRows);
            renderTable('trainings-container', ['Program Name', 'Section', 'Venue', 'Start Date', 'End Date', 'Start Time', 'End Time'], trainingRows);
        }

        function renderTable(containerId, headers, rows) {
            const container = document.getElementById(containerId);
            const validRows = rows.filter(row => row.some(cell => cell && cell !== '-' && cell !== ''));

            if (!validRows || validRows.length === 0) {
                container.innerHTML = `<div class="empty-msg">No active entries currently.</div>`;
                return;
            }

            // If there are many rows, duplicate them so the airport scroll loops seamlessly
            const needsScroll = validRows.length > 5;
            const displayRows = needsScroll ? [...validRows, ...validRows] : validRows;

            let html = `<table><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;

            displayRows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => {
                    html += `<td>${cell || '-'}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;

            if (needsScroll) {
                startAutoScroll(container);
            }
        }

        // Airport Ticker Auto-Scroll Logic
        function startAutoScroll(container) {
            let scrollTop = 0;
            const interval = setInterval(() => {
                if (container.scrollHeight > container.clientHeight) {
                    scrollTop += 0.5; // Controls the scroll speed
                    container.scrollTop = scrollTop;
                    
                    // When reaching the bottom of the duplicated list, reset to top
                    if (container.scrollTop + container.clientHeight >= container.scrollHeight - 1) {
                        scrollTop = 0;
                        container.scrollTop = 0;
                    }
                }
            }, 30);
            scrollIntervals.push(interval);
        }

        // Dynamic Google Drive Photo Ticker
        async function initPhotoTicker() {
            const track = document.getElementById('ticker-track');
            if (!track) return;

            try {
                const webAppUrl = "https://script.google.com/macros/s/AKfycbzXUs9luJNmNT5pFW00NAqeRGCdoH4x0HtbRK6H07ZaAbMfAbbE1tXlKfujGigi158TNA/exec";
                const response = await fetch(webAppUrl);
                let photoUrls = await response.json();

                if (!photoUrls || photoUrls.length === 0) {
                    photoUrls = [ "https://picsum.photos/id/10/200/150" ];
                }

                let shuffled = [...photoUrls].sort(() => Math.random() - 0.5);
                let doubleList = [...shuffled, ...shuffled];

                track.innerHTML = doubleList.map(url => `
                    <div class="ticker-item">
                        <img src="${url}" alt="Office Photo" loading="lazy" onerror="this.src='logo.png'">
                    </div>
                `).join('');
            } catch (error) {
                console.error("Error loading drive photos", error);
            }
        }

        fetchDashboardData();
        initPhotoTicker();
        
        setInterval(fetchDashboardData, 60000);
    </script>
</body>
</html>
