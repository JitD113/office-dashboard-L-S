<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics & Support Section Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #1e2430;
            color: #f4f4f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #161c24;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ea580c;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fb923c;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .clock {
            font-size: 1.05rem;
            font-weight: 500;
            color: #d4d4d8;
            white-space: nowrap;
        }
        .logo-img {
            height: 42px;
            width: auto;
            background: #ffffff;
            padding: 3px;
            border-radius: 4px;
            object-fit: contain;
        }

        /* 3-Column Layout (35% Guest House | 40% Meetings & Trainings | 25% Photo Rail) */
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 35fr 40fr 25fr;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }
        .card {
            background-color: #161c24;
            border: 1px solid #2d3748;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }
        .card-header {
            background-color: #212a3a;
            padding: 10px 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #2d3748;
            border-left: 4px solid #ea580c;
            color: #fed7aa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .card-body::-webkit-scrollbar {
            display: none;
        }

        /* Middle Column Vertical Stack */
        .col-middle-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            height: 100%;
        }

        /* Floating Card Tables */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            text-align: left;
            font-size: 0.95rem;
            table-layout: fixed;
        }
        th {
            color: #fdba74;
            font-weight: 600;
            background-color: #161c24;
            padding: 8px 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 10px 12px;
            color: #f4f4f5;
            word-wrap: break-word;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        td:first-child {
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
            border-left-width: 4px;
            border-left-style: solid;
        }
        td:last-child {
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* VIBRANT ROW PALETTES ON STEEL SLATE */
        
        /* 1. GUEST HOUSE PALETTE (Warm Amber / Copper Tints) */
        #guesthouse-container tr:nth-child(4n+1) td { background-color: #2a1e18; border-left-color: #ea580c; }
        #guesthouse-container tr:nth-child(4n+2) td { background-color: #241812; border-left-color: #f97316; }
        #guesthouse-container tr:nth-child(4n+3) td { background-color: #30221b; border-left-color: #fb923c; }
        #guesthouse-container tr:nth-child(4n+4) td { background-color: #20140f; border-left-color: #c2410c; }

        /* 2. MEETINGS PALETTE (Cool Sapphire / Indigo Tints) */
        #meetings-container tr:nth-child(4n+1) td { background-color: #192538; border-left-color: #0284c7; }
        #meetings-container tr:nth-child(4n+2) td { background-color: #141d2c; border-left-color: #38bdf8; }
        #meetings-container tr:nth-child(4n+3) td { background-color: #1e2e46; border-left-color: #60a5fa; }
        #meetings-container tr:nth-child(4n+4) td { background-color: #111824; border-left-color: #2563eb; }

        /* 3. TRAININGS PALETTE (Emerald / Jade Tints) */
        #trainings-container tr:nth-child(4n+1) td { background-color: #162b21; border-left-color: #059669; }
        #trainings-container tr:nth-child(4n+2) td { background-color: #11211a; border-left-color: #34d399; }
        #trainings-container tr:nth-child(4n+3) td { background-color: #1c3629; border-left-color: #10b981; }
        #trainings-container tr:nth-child(4n+4) td { background-color: #0d1a14; border-left-color: #047857; }

        /* Column Width Allocations */
        #guesthouse-container th:nth-child(1), #guesthouse-container td:nth-child(1) { width: 28%; }
        #guesthouse-container th:nth-child(2), #guesthouse-container td:nth-child(2) { width: 26%; }
        #guesthouse-container th:nth-child(3), #guesthouse-container td:nth-child(3) { width: 16%; }
        #guesthouse-container th:nth-child(4), #guesthouse-container td:nth-child(4) { width: 15%; }
        #guesthouse-container th:nth-child(5), #guesthouse-container td:nth-child(5) { width: 15%; }

        /* Muted styling for past completed events */
        tr.past-row td {
            opacity: 0.35;
            color: #a1a1aa;
        }
        .empty-msg {
            color: #71717a;
            text-align: center;
            padding: 20px;
            font-style: italic;
            font-size: 0.95rem;
        }
        
        /* Airport Mechanical Split-Flap Row Animation */
        .row-roll-up td {
            animation: airportRoll 0.65s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes airportRoll {
            0% { 
                opacity: 1; 
                transform: perspective(600px) rotateX(0deg);
                padding: 10px 12px; 
            }
            50% {
                opacity: 0.3;
                transform: perspective(600px) rotateX(-90deg);
                background-color: #0d1117;
            }
            100% { 
                opacity: 0; 
                transform: perspective(600px) rotateX(-90deg);
                padding: 0 12px; 
                font-size: 0px; 
                line-height: 0; 
                border-bottom: none; 
                color: transparent; 
            }
        }

        /* Single Photo Display with Vintage Watermark Background */
        .photo-rail-wrapper {
            position: relative;
            flex: 1;
            overflow: hidden;
            background-color: #161c24;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }
        .watermark-bg {
            position: absolute;
            inset: 0;
            background-image: url('watermark.jpeg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0.16;
            filter: grayscale(30%);
            z-index: 1;
            pointer-events: none;
        }
        .rail-vignette-mask {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, #161c24 0%, transparent 8%, transparent 92%, #161c24 100%);
            z-index: 3;
            pointer-events: none;
        }
        .photo-display-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .photo-card {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2d3748;
            background-color: #1e2430;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition: opacity 1s ease-in-out;
            opacity: 1;
        }
        .photo-card img.fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Logistics & Support Section, O/o the PAG (Audit), Telangana</h1>
        <div class="header-right">
            <div class="clock" id="live-clock">--:--:--</div>
            <img src="logo.png" alt="CAG Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
    </header>

    <div class="main-grid">
        <!-- Left Column (35%): Guest House Bookings -->
        <div class="card">
            <div class="card-header">Guest House Bookings (10 Rooms)</div>
            <div class="card-body" id="guesthouse-container">
                <div class="empty-msg">Loading Guest House entries...</div>
            </div>
        </div>

        <!-- Middle Column (40%): Meetings & Trainings Stack -->
        <div class="col-middle-stack">
            <div class="card" style="flex: 1;">
                <div class="card-header">Meetings & Reviews</div>
                <div class="card-body" id="meetings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>

            <div class="card" style="flex: 1;">
                <div class="card-header">Training Programs</div>
                <div class="card-body" id="trainings-container">
                    <div class="empty-msg">No active entries currently.</div>
                </div>
            </div>
        </div>

        <!-- Right Column (25%): Single Photo Highlight with Watermark Background -->
        <div class="card">
            <div class="card-header">Office Highlights</div>
            <div class="photo-rail-wrapper">
                <div class="watermark-bg"></div>
                <div class="rail-vignette-mask"></div>
                <div class="photo-display-container">
                    <div class="photo-card">
                        <img id="single-photo-img" src="logo.png" alt="Office Highlight">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // TV-Safe Zero Padding Helper
        function pad2(num) {
            return (num < 10 ? '0' : '') + num;
        }

        // Live Clock
        function updateClock() {
            try {
                var now = new Date();
                var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
                var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                var dayStr = days[now.getDay()];
                var dateStr = now.getDate();
                var monthStr = months[now.getMonth()];
                var yearStr = now.getFullYear();
                
                var hrs = pad2(now.getHours());
                var mins = pad2(now.getMinutes());
                var secs = pad2(now.getSeconds());
                
                document.getElementById('live-clock').innerText = dayStr + ', ' + dateStr + ' ' + monthStr + ' ' + yearStr + ' | ' + hrs + ':' + mins + ':' + secs;
            } catch (e) {
                document.getElementById('live-clock').innerText = new Date().toLocaleString();
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        var csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSN5svfekbhXD-4RIbXpYHhAJr-0KBBZ8U81dyrcq4gLPN70iUQW_MzDGo8Ww0vidLgihQSeenxMghe/pub?gid=91440551&single=true&output=csv";

        async function fetchDashboardData() {
            try {
                var response = await fetch(csvUrl);
                if (!response.ok) throw new Error("HTTP error " + response.status);
                var csvText = await response.text();
                if (csvText) {
                    parseCSVAndRender(csvText);
                }
            } catch (error) {
                console.warn("CSV Fetch Warning:", error);
            }
        }

        function cleanVal(val) {
            if (!val || val === '' || val === '-' || val.indexOf('1899') !== -1 || val.indexOf('NaN') !== -1) return '-';
            if (val.indexOf('00:00:00') !== -1) return val.split(' ')[0];
            return val.trim();
        }

        function formatDateStandard(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return '-';
            var dd = pad2(dateObj.getDate());
            var mm = pad2(dateObj.getMonth() + 1);
            var yyyy = dateObj.getFullYear();
            return dd + '/' + mm + '/' + yyyy;
        }

        function parseDate(str) {
            if (!str || typeof str !== 'string') return null;
            var norm = str.trim();
            if (norm === '' || norm === '-' || norm.indexOf('NaN') !== -1) return null;

            var monthMap = {
                jan:0, january:0, feb:1, february:1, mar:2, march:2, apr:3, april:3,
                may:4, jun:5, june:5, jul:6, july:6, aug:7, august:7,
                sep:8, september:8, oct:9, october:9, nov:10, november:10, dec:11, december:11
            };

            var cleaned = norm.replace(/[\.-]/g, '/');
            var parts = cleaned.split('/');

            if (parts.length === 3) {
                var p0 = parts[0].trim();
                var p1 = parts[1].trim();
                var p2 = parts[2].trim();

                var monthIdx = monthMap[p1.toLowerCase()];
                if (monthIdx !== undefined) {
                    return new Date(parseInt(p2, 10), monthIdx, parseInt(p0, 10));
                }

                if (p0.length === 4) {
                    return new Date(parseInt(p0, 10), parseInt(p1, 10) - 1, parseInt(p2, 10));
                }
                return new Date(parseInt(p2, 10), parseInt(p1, 10) - 1, parseInt(p0, 10));
            }
            return null;
        }

        function cleanAndFormatDateCell(cellVal) {
            var parsed = parseDate(cellVal);
            return parsed ? formatDateStandard(parsed) : cleanVal(cellVal);
        }

        function CSVToArray(text) {
            if (!text) return [];
            var p = '', c = '', r = [];
            var q = false;
            var row = [''];
            for (var i = 0; i < text.length; i++) {
                c = text[i];
                var next = text[i+1];
                if (c === '"') {
                    if (q && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { q = !q; }
                } else if (c === ',' && !q) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !q) {
                    if (c === '\r' && next === '\n') { i++; }
                    r.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') r.push(row);
            return r;
        }

        function sortRowsByDate(rows, startDateColIdx, endDateColIdx) {
            var today = new Date();
            today.setHours(0, 0, 0, 0);

            return rows.sort(function(a, b) {
                var startA = parseDate(a[startDateColIdx]);
                var endA = endDateColIdx !== undefined ? (parseDate(a[endDateColIdx]) || startA) : startA;
                
                var startB = parseDate(b[startDateColIdx]);
                var endB = endDateColIdx !== undefined ? (parseDate(b[endDateColIdx]) || startB) : startB;

                var isPastA = endA ? (endA < today) : false;
                var isPastB = endB ? (endB < today) : false;

                if (isPastA !== isPastB) return isPastA ? 1 : -1;
                if (!isPastA) {
                    if (!startA && !startB) return 0;
                    if (!startA) return 1;
                    if (!startB) return -1;
                    return startA - startB;
                }
                if (!endA && !endB) return 0;
                if (!endA) return 1;
                if (!endB) return -1;
                return endB - endA;
            });
        }

        function parseCSVAndRender(csvText) {
            var lines = CSVToArray(csvText);

            var guesthouseRows = [];
            var meetingRows = [];
            var trainingRows = [];
            var currentSection = 'guesthouse';

            lines.forEach(function(cols) {
                if (!cols || cols.length === 0 || cols.every(function(c) { return c === ''; })) return;
                
                var textJoined = cols.join(' ').toUpperCase();
                
                if (textJoined.indexOf('MEETINGS & REVIEWS') !== -1) { currentSection = 'meetings'; return; }
                if (textJoined.indexOf('TRAINING PROGRAMS') !== -1) { currentSection = 'trainings'; return; }
                if (textJoined.indexOf('GUEST HOUSE BOOKINGS') !== -1) { currentSection = 'guesthouse'; return; }
                if (textJoined.indexOf('EXAMS SCHEDULED') !== -1) { currentSection = 'ignore'; return; }

                if (textJoined.indexOf('---') !== -1 || textJoined.indexOf('ROOM NUMBER') !== -1 || textJoined.indexOf('MEETING NAME') !== -1 || textJoined.indexOf('TRAINING PROGRAM') !== -1) {
                    return;
                }

                if (currentSection === 'guesthouse' && cols[0]) {
                    guesthouseRows.push([cols[0], cols[1], cols[2], cleanAndFormatDateCell(cols[3]), cleanAndFormatDateCell(cols[4])]);
                }
                if (currentSection === 'meetings' && cols[0]) {
                    meetingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanAndFormatDateCell(cols[3]), cleanVal(cols[5]), cleanVal(cols[6])]);
                }
                if (currentSection === 'trainings' && cols[0]) {
                    trainingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanAndFormatDateCell(cols[3]), cleanAndFormatDateCell(cols[4]), cleanVal(cols[6]), cleanVal(cols[7])]);
                }
            });

            guesthouseRows = sortRowsByDate(guesthouseRows, 3, 4);
            meetingRows = sortRowsByDate(meetingRows, 3, 3);
            trainingRows = sortRowsByDate(trainingRows, 3, 4);

            renderTable('guesthouse-container', ['Room', 'Guest', 'Designation', 'From', 'To'], guesthouseRows, 3, 4);
            renderTable('meetings-container', ['Meeting Name', 'Section', 'Venue', 'Date', 'Start', 'End'], meetingRows, 3, 3);
            renderTable('trainings-container', ['Program Name', 'Section', 'Venue', 'Start Date', 'End Date', 'Start', 'End'], trainingRows, 3, 4);
        }

        function renderTable(containerId, headers, rows, startDateIdx, endDateIdx) {
            var container = document.getElementById(containerId);
            var validRows = rows.filter(function(row) {
                return row.some(function(cell) { return cell && cell !== '-' && cell !== ''; });
            });

            if (!validRows || validRows.length === 0) {
                container.innerHTML = '<div class="empty-msg">No active entries currently.</div>';
                return;
            }

            var today = new Date();
            today.setHours(0, 0, 0, 0);

            var html = '<table><thead><tr>';
            headers.forEach(function(h) { html += '<th>' + h + '</th>'; });
            html += '</tr></thead><tbody>';

            validRows.forEach(function(row) {
                var startD = parseDate(row[startDateIdx]);
                var endD = endDateIdx !== undefined ? (parseDate(row[endDateIdx]) || startD) : startD;
                var isPast = endD ? (endD < today) : false;

                html += '<tr class="' + (isPast ? 'past-row' : '') + '">';
                row.forEach(function(cell) {
                    html += '<td>' + (cell || '-') + '</td>';
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Master Staggered Ticker: Rotates 1 box every 10s
        var currentFlipTarget = 0;
        function triggerStaggeredFlip() {
            var containers = ['guesthouse-container', 'meetings-container', 'trainings-container'];
            
            for (var i = 0; i < 3; i++) {
                var idx = (currentFlipTarget + i) % 3;
                var containerId = containers[idx];
                var container = document.getElementById(containerId);
                if (container) {
                    var tbody = container.querySelector('tbody');
                    if (tbody) {
                        var rows = tbody.querySelectorAll('tr');
                        if (rows.length >= 2) {
                            var firstRow = rows[0];
                            firstRow.classList.add('row-roll-up');
                            setTimeout(function() {
                                firstRow.classList.remove('row-roll-up');
                                tbody.appendChild(firstRow);
                            }, 650);
                            
                            currentFlipTarget = (idx + 1) % 3;
                            return; 
                        }
                    }
                }
            }
        }
        setInterval(triggerStaggeredFlip, 10000);

        // Photo Rail: Single Card Cross-Fade Every 15 Seconds
        var photoUrlsList = [];
        var currentPhotoIdx = 0;
        var photoInterval = null;

        async function initPhotoRail() {
            var webAppUrl = "https://script.google.com/macros/s/AKfycbzXUs9luJNmNT5pFW00NAqeRGCdoH4x0HtbRK6H07ZaAbMfAbbE1tXlKfujGigi158TNA/exec";

            try {
                var res = await fetch(webAppUrl);
                photoUrlsList = await res.json();
            } catch(e) {}

            if (!photoUrlsList || photoUrlsList.length === 0) {
                photoUrlsList = ["logo.png"];
            }

            photoUrlsList.sort(function() { return Math.random() - 0.5; });
            
            var imgElem = document.getElementById('single-photo-img');
            if (imgElem) {
                imgElem.src = photoUrlsList[0];
            }

            if (photoInterval) clearInterval(photoInterval);

            photoInterval = setInterval(function() {
                if (photoUrlsList.length <= 1) return;
                
                var img = document.getElementById('single-photo-img');
                if (!img) return;

                img.classList.add('fade-out');

                setTimeout(function() {
                    currentPhotoIdx = (currentPhotoIdx + 1) % photoUrlsList.length;
                    img.src = photoUrlsList[currentPhotoIdx];
                    
                    img.onload = function() {
                        img.classList.remove('fade-out');
                    };
                    setTimeout(function() {
                        img.classList.remove('fade-out');
                    }, 120);
                }, 1000); 
            }, 25000); 
        }

        fetchDashboardData();
        initPhotoRail();
        setInterval(fetchDashboardData, 60000);

        // Click for fullscreen
        document.body.addEventListener('click', function() {
            var elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            }
        });

        // Hide cursor after 3s
        var cursorTimeout;
        document.addEventListener('mousemove', function() {
            document.body.style.cursor = 'default';
            clearTimeout(cursorTimeout);
            cursorTimeout = setTimeout(function() {
                document.body.style.cursor = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
