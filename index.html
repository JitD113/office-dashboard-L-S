<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics & Support Section Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #1e2430;
            color: #f4f4f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* GLOBAL CANVAS WATERMARK BACKGROUND */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: url('watermark.jpeg');
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
        }

        header {
            background-color: #161c24;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ea580c;
            flex-shrink: 0;
            position: relative;
            z-index: 2;
        }
        header h1 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fb923c;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .clock {
            font-size: 1.05rem;
            font-weight: 500;
            color: #d4d4d8;
            white-space: nowrap;
        }
        .logo-img {
            height: 42px;
            width: auto;
            background: #ffffff;
            padding: 3px;
            border-radius: 4px;
            object-fit: contain;
        }

        /* 3-Column Layout (35% Guest House | 40% Meetings & Trainings | 25% Right Stack) */
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 35fr 40fr 25fr;
            gap: 12px;
            padding: 12px;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }
        .card {
            background-color: #161c24;
            border: 1px solid #2d3748;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
        }
        .card-header {
            background-color: #212a3a;
            padding: 10px 16px;
            font-size: 1.1rem;
            font-weight: 600;
            border-bottom: 1px solid #2d3748;
            border-left: 4px solid #ea580c;
            color: #fed7aa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .card-body::-webkit-scrollbar {
            display: none;
        }

        /* Middle & Right Column Vertical Stacks */
        .col-middle-stack, .col-right-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow: hidden;
            height: 100%;
        }

        /* Floating Card Tables */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            text-align: left;
            font-size: 0.95rem;
            table-layout: fixed;
        }
        th {
            color: #fdba74;
            font-weight: 600;
            background-color: #161c24;
            padding: 8px 12px;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td {
            padding: 10px 12px;
            color: #f4f4f5;
            word-wrap: break-word;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        td:first-child {
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
            border-left-width: 4px;
            border-left-style: solid;
        }
        td:last-child {
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* VIBRANT ROW PALETTES ON STEEL SLATE */
        #guesthouse-container tr:nth-child(4n+1) td { background-color: #2a1e18; border-left-color: #ea580c; }
        #guesthouse-container tr:nth-child(4n+2) td { background-color: #241812; border-left-color: #f97316; }
