<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logistics & Support Section Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #1c1411;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background-color: #2a1b15;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ea580c;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo-img {
            height: 45px;
            width: auto;
            background: white;
            padding: 3px;
            border-radius: 4px;
            object-fit: contain;
        }
        header h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #fb923c;
        }
        .clock {
            font-size: 1.1rem;
            font-weight: 500;
            color: #cbd5e1;
            white-space: nowrap;
        }
        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            grid-template-rows: repeat(3, 1fr);
            gap: 12px;
            padding: 12px;
            overflow: hidden;
        }
        .card.guesthouse-card {
            grid-row: span 3;
        }
        .card {
            background-color: #261914;
            border: 1px solid #432418;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }
        .card-header {
            background-color: #332018;
            padding: 10px 15px;
            font-size: 0.95rem;
            font-weight: 600;
            border-bottom: 1px solid #432418;
            color: #fed7aa;
        }
        .card-body {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }
        th, td {
            padding: 8px 8px;
            border-bottom: 1px solid #3b2319;
        }
        th {
            color: #fdba74;
            font-weight: 600;
            background-color: rgba(51, 32, 24, 0.9);
            position: sticky;
            top: 0;
        }
        td {
            color: #f1f5f9;
        }
        tr:hover td {
            background-color: rgba(234, 88, 12, 0.15);
        }
        .empty-msg {
            color: #9a7b6c;
            text-align: center;
            padding: 12px;
            font-style: italic;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="logo.png" alt="CAG Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>Logistics & Support Section, O/o the PAG (Audit), Telangana</h1>
        </div>
        <div class="clock" id="live-clock">Loading...</div>
    </header>

    <div class="main-grid">
        <!-- Guest House Card -->
        <div class="card guesthouse-card">
            <div class="card-header">Guest House Bookings (10 Rooms)</div>
            <div class="card-body" id="guesthouse-container">
                <div class="empty-msg">Loading data from Google Sheet...</div>
            </div>
        </div>

        <!-- Exams Card -->
        <div class="card">
            <div class="card-header">Exams Scheduled</div>
            <div class="card-body" id="exams-container">
                <div class="empty-msg">No active entries currently.</div>
            </div>
        </div>

        <!-- Meetings Card -->
        <div class="card">
            <div class="card-header">Meetings & Reviews</div>
            <div class="card-body" id="meetings-container">
                <div class="empty-msg">No active entries currently.</div>
            </div>
        </div>

        <!-- Trainings Card -->
        <div class="card">
            <div class="card-header">Training Programs</div>
            <div class="card-body" id="trainings-container">
                <div class="empty-msg">No active entries currently.</div>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            try {
                const now = new Date();
                document.getElementById('live-clock').innerText = now.toLocaleDateString('en-IN', {
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric'
                }) + ' | ' + now.toLocaleTimeString();
            } catch (e) {}
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Updated with your active spreadsheet ID and MasterFeed gid=91440551
        const csvUrl = "https://docs.google.com/spreadsheets/d/1AOUTCpbfal9HYFDtClwAAQqWEA1R-vE0SenWH-8/export?format=csv&gid=91440551";

        async function fetchDashboardData() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.text();
                parseCSVAndRender(data);
            } catch (error) {
                console.error("Error fetching sheet data:", error);
                document.getElementById('guesthouse-container').innerHTML = `<div class="empty-msg">Failed to load data. Check sharing permissions.</div>`;
            }
        }

        function cleanVal(val) {
            if (!val || val === '' || val === '-' || val.includes('1899') || val.includes('NaN')) return '-';
            if (val.includes('00:00:00')) {
                return val.split(' ')[0];
            }
            return val;
        }

        function parseCSVAndRender(csvText) {
            const lines = csvText.split('\n').map(line => {
                return line.split(',').map(val => val.replace(/^"|"$/g, '').trim());
            });

            let guesthouseRows = [];
            let examRows = [];
            let meetingRows = [];
            let trainingRows = [];
            let currentSection = 'guesthouse';

            lines.forEach(cols => {
                if (!cols || cols.length === 0 || cols.every(c => c === '')) return;
                
                const textJoined = cols.join(' ').toUpperCase();
                
                if (textJoined.includes('EXAMS SCHEDULED')) { currentSection = 'exams'; return; }
                if (textJoined.includes('MEETINGS & REVIEWS')) { currentSection = 'meetings'; return; }
                if (textJoined.includes('TRAINING PROGRAMS')) { currentSection = 'trainings'; return; }
                if (textJoined.includes('GUEST HOUSE BOOKINGS')) { currentSection = 'guesthouse'; return; }

                if (textJoined.includes('---') || textJoined.includes('ROOM NUMBER') || textJoined.includes('EXAM / SUBJECT') || textJoined.includes('MEETING NAME') || textJoined.includes('TRAINING PROGRAM')) {
                    return;
                }

                if (currentSection === 'guesthouse' && cols[0]) {
                    guesthouseRows.push([cols[0], cols[1], cols[2], cleanVal(cols[3]), cleanVal(cols[4])]);
                }
                if (currentSection === 'exams' && cols[0]) {
                    examRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[4]), cleanVal(cols[5])]);
                }
                if (currentSection === 'meetings' && cols[0]) {
                    meetingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[4])]);
                }
                if (currentSection === 'trainings' && cols[0]) {
                    trainingRows.push([cols[0], cols[1], cleanVal(cols[2]), cleanVal(cols[3]), cleanVal(cols[4]), cleanVal(cols[5])]);
                }
            });

            renderTable('guesthouse-container', ['Room', 'Guest', 'Designation', 'From', 'To'], guesthouseRows);
            renderTable('exams-container', ['Exam / Subject', 'Section', 'Date From', 'Date To', 'Start Time', 'End Time'], examRows);
            renderTable('meetings-container', ['Meeting Name', 'Section', 'Date', 'Start Time', 'End Time'], meetingRows);
            renderTable('trainings-container', ['Program Name', 'Section', 'Start Date', 'End Date', 'Start Time', 'End Time'], trainingRows);
        }

        function renderTable(containerId, headers, rows) {
            const container = document.getElementById(containerId);
            const validRows = rows.filter(row => row.some(cell => cell && cell !== '-' && cell !== ''));

            if (!validRows || validRows.length === 0) {
                container.innerHTML = `<div class="empty-msg">No active entries currently.</div>`;
                return;
            }

            let html = `<table><thead><tr>`;
            headers.forEach(h => html += `<th>${h}</th>`);
            html += `</tr></thead><tbody>`;

            validRows.forEach(row => {
                html += `<tr>`;
                row.forEach(cell => {
                    html += `<td>${cell || '-'}</td>`;
                });
                html += `</tr>`;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        fetchDashboardData();
        setInterval(fetchDashboardData, 300000);
    </script>
</body>
</html>
